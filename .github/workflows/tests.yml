name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Prepare SQLite database
        run: touch database/database.sqlite

      - name: Setup Application
        run: composer setup
        env:
          # .env.example memakai MySQL (dev lokal); CI cukup SQLite.
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite

      - name: Run CI Checks
        run: composer ci:check

  mysql:
    # Suite lengkap di MySQL 8, termasuk tests/Concurrency (uji race nomor & submit ganda)
    # yang di-skip di SQLite. Lint, typecheck, dan Vitest cukup di job `ci`.
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: si_lembur
          MYSQL_USER: si_lembur
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: secret
          TZ: Asia/Jakarta
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: si_lembur
      DB_USERNAME: si_lembur
      DB_PASSWORD: secret

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # composer setup: install, .env, key, migrate (MySQL), npm install, npm run build (Vite manifest).
      - name: Setup Application
        run: composer setup

      - name: Run Pest on MySQL
        run: php artisan test
