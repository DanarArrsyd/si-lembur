# Hanya untuk development lokal. Produksi memakai MySQL/MariaDB Hostinger.
services:
    mysql:
        image: mysql:8.0
        environment:
            MYSQL_DATABASE: si_lembur
            MYSQL_USER: si_lembur
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: secret
            TZ: Asia/Jakarta
        ports:
            - '${FORWARD_DB_PORT:-3307}:3306'
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-psecret']
            interval: 5s
            retries: 20

volumes:
    mysql-data:
